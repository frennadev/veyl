# Render blueprint: the relayer (Docker web service) and the static site, on devnet. Secrets are entered in the Render
# dashboard (sync: false), never committed. Set NETWORK / the build --network to mainnet only after DEPLOY.md "Before mainnet".
# Steps: DEPLOY.md "Hosting on Render".
services:
  # ------------------------------------------------------------------ relayer: fees, submissions, faucet, token data, trade index
  - type: web
    name: veyl-sol-relayer
    runtime: docker
    dockerfilePath: ./relayer/Dockerfile
    dockerContext: .
    plan: starter            # always on (the free plan sleeps, and the trade index would rebuild on every wake)
    healthCheckPath: /health
    envVars:
      - key: NETWORK
        value: "devnet"
      - key: RPC_URL   # a dedicated devnet RPC (Helius etc.); the public one rate-limits the relayer
        sync: false
      - key: RELAYER_SECRET_KEY   # the relayer hot wallet (fee-only, low balance): JSON byte array or base58
        sync: false
      - key: POSTMAN_SECRET_KEY   # optional: approved-set publisher key (never the relayer's key)
        sync: false
      - key: FAUCET_SECRET_KEY   # DEVNET ONLY: the devnet deployer key (mint authority of the mock tokens) for "Get test tokens". Never set on mainnet.
        sync: false
      - key: ALLOWED_ORIGINS   # CORS: the site's public URL (a blueprint's fromService host is the internal name, not this); add a custom domain here, comma separated
        value: "https://veyl-sol-site.onrender.com"
      - key: MIN_FEE_BPS
        value: "5"
      - key: LOW_BALANCE_SOL
        value: "0.05"
      - key: TRUST_PROXY   # Render's proxy: rate-limit on the client address it appends to X-Forwarded-For (REVIEW.md L-2)
        value: "1"
      - key: FEE_COVER     # the fee must pay back at least this multiple of the rent + fees a request costs (REVIEW.md M-1)
        value: "1"
      - key: ACTIVITY_MS   # the trade index's sweep interval: every request is RPC credits (2 min ≈ 20k requests a day)
        value: "120000"
      - key: ACTIVITY_MAX_SWAPS   # the trade index's memory cap across pools, sized for the starter plan's 512 MB
        value: "100000"
      - key: JUPITER_API_KEY   # optional: token names and logos without the keyless rate limit
        sync: false
      - key: POOL_LOOKUP_TABLES   # optional: the relayer's lookup tables for pools listed since the deploy (it prints them when it makes one)
        sync: false

  # ------------------------------------------------------------------ the site: homepage, docs, app (static, built from web/)
  - type: web
    name: veyl-sol-site
    runtime: static
    buildCommand: npm ci && npm run build:site -- --network devnet
    staticPublishPath: dist/site
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: RELAYER_URL   # the relayer's public URL, baked into veyl.config.js (a blueprint's fromService host is the internal name)
        value: "https://veyl-sol-relayer.onrender.com"
      - key: SITE_RPC_URL   # the RPC the browser uses. It is public (every visitor's browser sees it): use a separate key, limited to the site's domain
        sync: false
    routes:
      - type: rewrite
        source: /app
        destination: /app.html
      - type: rewrite
        source: /docs
        destination: /docs.html
    # The same headers scripts/build-site.js writes to dist/site/_headers (Render doesn't read that file). connect-src and
    # img-src allow any https origin here because the relayer's and the RPC's hosts are only known once the services exist;
    # tighten them to those hosts after the first deploy if you like.
    headers:
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: Referrer-Policy
        value: "no-referrer"
      - path: "/*"
        name: X-Frame-Options
        value: "DENY"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: "/*"
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: "/*"
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: "/*.wasm"
        name: Content-Type
        value: "application/wasm"
      - path: "/*.wasm"
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: "/*.zkey"
        name: Content-Type
        value: "application/octet-stream"
      - path: "/*.zkey"
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: "/zk/*"
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: "/*.bin"
        name: Content-Type
        value: "application/octet-stream"
      - path: "/*.js"
        name: Content-Type
        value: "application/javascript; charset=utf-8"
      - path: "/*.js"
        name: Cache-Control
        value: "public, max-age=300, must-revalidate"
      - path: "/*.html"
        name: Cache-Control
        value: "no-cache"
      - path: "/veyl.config.js"
        name: Cache-Control
        value: "no-cache"
      - path: "/sandbox.config.js"
        name: Cache-Control
        value: "no-cache"

  # ------------------------------------------------------------------ the sealed-batch committee (2 of 3), devnet testing
  # Sealed swaps settle only while t of the n nodes run. Members should run on separate infrastructure (committee/README.md
  # "Trust"); all three here is for devnet testing only. Each node starts from its existing key share (SHARE_JSON, a
  # secret) and the public transcript in committee/transcript.devnet.json, so no disk and no new key generation is needed.
  # Private services: nothing public; after the key generation the nodes only talk to the chain.
  - type: pserv
    name: veyl-sol-committee-1
    runtime: docker
    dockerfilePath: ./committee/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NETWORK
        value: "devnet"
      - key: STATE_DIR      # no disk: the share comes from SHARE_JSON on every start
        value: "/tmp/committee"
      - key: RPC_URL        # a dedicated devnet RPC (may be the relayer's)
        sync: false
      - key: NODE_SECRET_KEY   # this member's node key: ~/keys/veyl/committee-devnet/node-1.json (it pays its share transactions: keep devnet SOL on it)
        sync: false
      - key: COMMITTEE_JSON    # ~/keys/veyl/committee-devnet/config-1.json (index, t, n, peers; public keys only)
        sync: false
      - key: SHARE_JSON        # ~/keys/veyl/committee-devnet/state-1/share.json: this member's KEY SHARE (secret)
        sync: false

  - type: pserv
    name: veyl-sol-committee-2
    runtime: docker
    dockerfilePath: ./committee/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NETWORK
        value: "devnet"
      - key: STATE_DIR      # no disk: the share comes from SHARE_JSON on every start
        value: "/tmp/committee"
      - key: RPC_URL        # a dedicated devnet RPC (may be the relayer's)
        sync: false
      - key: NODE_SECRET_KEY   # this member's node key: ~/keys/veyl/committee-devnet/node-2.json (it pays its share transactions: keep devnet SOL on it)
        sync: false
      - key: COMMITTEE_JSON    # ~/keys/veyl/committee-devnet/config-2.json (index, t, n, peers; public keys only)
        sync: false
      - key: SHARE_JSON        # ~/keys/veyl/committee-devnet/state-2/share.json: this member's KEY SHARE (secret)
        sync: false

  - type: pserv
    name: veyl-sol-committee-3
    runtime: docker
    dockerfilePath: ./committee/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NETWORK
        value: "devnet"
      - key: STATE_DIR      # no disk: the share comes from SHARE_JSON on every start
        value: "/tmp/committee"
      - key: RPC_URL        # a dedicated devnet RPC (may be the relayer's)
        sync: false
      - key: NODE_SECRET_KEY   # this member's node key: ~/keys/veyl/committee-devnet/node-3.json (it pays its share transactions: keep devnet SOL on it)
        sync: false
      - key: COMMITTEE_JSON    # ~/keys/veyl/committee-devnet/config-3.json (index, t, n, peers; public keys only)
        sync: false
      - key: SHARE_JSON        # ~/keys/veyl/committee-devnet/state-3/share.json: this member's KEY SHARE (secret)
        sync: false
