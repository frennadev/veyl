# Netlify: builds the static site and serves dist/site. The build also writes dist/site/_headers with the CSP narrowed to
# this deployment's RPC and relayer (both policies apply; the narrower one wins).
[build]
  command = "npm ci && npm run build:site -- --network devnet"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "20"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://api.devnet.solana.com https://veyl-sol-relayer.onrender.com wss://api.devnet.solana.com https://hermes.pyth.network https://api.jup.ag https://api.coingecko.com https://api.exchange.coinbase.com https://api.geckoterminal.com https://api.dexscreener.com https://dlmm-api.meteora.ag https://api-v3.raydium.io https://api.orca.so; img-src 'self' data: https://veyl-sol-relayer.onrender.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.zkey"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/zk/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.bin"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/sandbox.config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/veyl.config.js"
  [headers.values]
    Cache-Control = "no-cache"
