[package]
name = "veyl_pool"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "veyl_pool"
[features]
# no-log-ix-name: no "Instruction: X" log line per call (every transact_cpi / deposit_receipt / consume_* CPI saved ~40 bytes
# of the ~10 KB a transaction may log; nothing reads them). veyl_entry keeps its own: e2e/run.js, e2e/devnet.js find sealed
# swaps by the "Instruction: SubmitSwap" line.
default = ["no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
mainnet = []
[dependencies]
# event-cpi: the shielded tree's events also travel in one self-CPI per instruction (Evs in src/lib.rs), inner-instruction
# data that no log cut drops. (Cargo unifies features: veyl_entry, which depends on this crate, gets it too.)
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = "0.31.1"
groth16-solana = "0.2.0"
solana-poseidon = "2"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
