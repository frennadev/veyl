[package]
name = "veyl_bin"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "veyl_bin"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
mainnet = []
# devnet-only one-off migration (migrate_factory, migrate_pool): scripts/build.sh dev profile only, never with `mainnet`
devnet-migrate = []
[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
uint = { version = "0.10", default-features = false }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
